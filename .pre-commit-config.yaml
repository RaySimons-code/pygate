repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [ python ]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [ python ]

      - id: mypy
        name: mypy
        entry: uv run mypy src/pygate
        language: system
        pass_filenames: false
        types: [ python ]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]